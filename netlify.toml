[build]
  command = "npm ci && npm install --no-save @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Directory for Netlify Functions (if needed in the future)
  directory = "netlify/functions"
